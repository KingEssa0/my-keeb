[package]
name = "keeb65"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rmk = { version = "=0.8.2", default-features = false, features = ["rp2040", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-rp = { version = "0.8", features = ["rp2040", "defmt", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.9", features = ["defmt", "arch-cortex-m", "executor-thread"] }
cortex-m-rt = "0.7.5"
portable-atomic = { version = "1.11", features = ["critical-section"] }
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = "fat"
